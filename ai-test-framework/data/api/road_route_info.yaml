# 接口自动化 YAML 示例：后续 AI 可基于页面抓取结果生成同结构用例。
suite: "农村公路路线信息接口"
description: "示例用例默认禁用；填入真实接口路径和断言后改 enabled 为 true。"

defaults:
  auth: true
  request:
    headers:
      Accept: "application/json"

cases:
  - id: "route_info_query"
    name: "路线信息查询"
    enabled: false
    request:
      method: "GET"
      path: "/api/road/route-info"
      params:
        keyword: "C001330111"
    assertions:
      - type: "status_code"
        expected: 200
        message: "路线信息查询接口应返回 200"
      - type: "header_contains"
        name: "Content-Type"
        expected: "application/json"
        message: "响应应为 JSON"
      - type: "json_path_exists"
        path: "data"
        message: "响应中应包含 data 字段"
