# 多环境配置：默认使用 test，可通过 pytest --env 或 APP_ENV 切换。
# 当前框架以接口自动化为主；browser、viewport、auth 为可选页面抓取/UI 辅助配置。
default_env: test

environments:
  test:
    base_url: "http://10.6.20.233:8891"
    entry_path: "/#/about/homepage"
    browser: "chromium"
    headless: true
    slow_mo: 0
    timeout: 10000
    api:
      # 默认复用 base_url；如果接口网关和页面地址不同，可以单独填写。
      base_url: ""
      auth:
        token_env: "ACCESS_TOKEN"
        header_name: "Authorization"
        header_prefix: "Bearer"
        login:
          # 填真实登录接口路径后，未提供 ACCESS_TOKEN 时会自动调用接口取 token。
          path: ""
          method: "POST"
          username_env: "LOGIN_USERNAME"
          password_env: "LOGIN_PASSWORD"
          username_field: "userName"
          password_field: "password"
          password_default: ""
          token_json_path: "data.access_token"
    viewport:
      width: 1440
      height: 900
    auth:
      storage: "localStorage"
      storage_key: "access_token"
      login:
        path: "/#/Login"
        username_env: "LOGIN_USERNAME"
        password_env: "LOGIN_PASSWORD"
        password_default: ""

  uat:
    # 使用 UAT 前请替换地址，或设置 BASE_URL 环境变量覆盖。
    base_url: "https://uat.example.com"
    entry_path: "/#/about/homepage"
    browser: "chromium"
    headless: true
    slow_mo: 0
    timeout: 10000
    api:
      base_url: ""
      auth:
        token_env: "ACCESS_TOKEN"
        header_name: "Authorization"
        header_prefix: "Bearer"
        login:
          path: ""
          method: "POST"
          username_env: "LOGIN_USERNAME"
          password_env: "LOGIN_PASSWORD"
          username_field: "userName"
          password_field: "password"
          password_default: ""
          token_json_path: "data.access_token"
    viewport:
      width: 1440
      height: 900
    auth:
      storage: "localStorage"
      storage_key: "access_token"
      login:
        path: "/#/Login"
        username_env: "LOGIN_USERNAME"
        password_env: "LOGIN_PASSWORD"
        password_default: ""

  prod:
    # 使用生产环境前请替换地址，或设置 BASE_URL 环境变量覆盖。
    base_url: "https://prod.example.com"
    entry_path: "/#/about/homepage"
    browser: "chromium"
    headless: true
    slow_mo: 0
    timeout: 10000
    api:
      base_url: ""
      auth:
        token_env: "ACCESS_TOKEN"
        header_name: "Authorization"
        header_prefix: "Bearer"
        login:
          path: ""
          method: "POST"
          username_env: "LOGIN_USERNAME"
          password_env: "LOGIN_PASSWORD"
          username_field: "userName"
          password_field: "password"
          password_default: ""
          token_json_path: "data.access_token"
    viewport:
      width: 1440
      height: 900
    auth:
      storage: "localStorage"
      storage_key: "access_token"
      login:
        path: "/#/Login"
        username_env: "LOGIN_USERNAME"
        password_env: "LOGIN_PASSWORD"
        password_default: ""
