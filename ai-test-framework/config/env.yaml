# 多环境配置：默认使用 test，可通过 pytest --env 或 APP_ENV 切换。
default_env: test

environments:
  test:
    base_url: "http://10.6.20.233:8891"
    entry_path: "/#/about/homepage"
    browser: "chromium"
    headless: true
    slow_mo: 0
    timeout: 10000
    viewport:
      width: 1440
      height: 900
    auth:
      storage: "localStorage"
      storage_key: "access_token"

  uat:
    # 使用 UAT 前请替换地址，或设置 BASE_URL 环境变量覆盖。
    base_url: "https://uat.example.com"
    entry_path: "/#/about/homepage"
    browser: "chromium"
    headless: true
    slow_mo: 0
    timeout: 10000
    viewport:
      width: 1440
      height: 900
    auth:
      storage: "localStorage"
      storage_key: "access_token"

  prod:
    # 使用生产环境前请替换地址，或设置 BASE_URL 环境变量覆盖。
    base_url: "https://prod.example.com"
    entry_path: "/#/about/homepage"
    browser: "chromium"
    headless: true
    slow_mo: 0
    timeout: 10000
    viewport:
      width: 1440
      height: 900
    auth:
      storage: "localStorage"
      storage_key: "access_token"
